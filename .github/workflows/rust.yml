name: Rust migration
on:
  push:
    paths: ["rust/**", "backend/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "backend/**", ".github/workflows/rust.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen Rust toolchain
        run: rustup show
        working-directory: rust
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Check Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust
      - name: Test Rust compatibility and resource controls
        run: cargo test --workspace --locked
        working-directory: rust
      - name: Build native tools
        run: cargo build --workspace --release --locked
        working-directory: rust
      - name: Install Python reference dependencies
        run: python -m pip install -r backend/requirements-rust-reference.txt
      - name: Verify contract and FSRS reference drift
        run: python backend/scripts/export_rust_reference.py --check
      - name: Verify native API, content and catalogue parity
        working-directory: backend
        env:
          PYTHONPATH: app:tests:.
          ENGLISH_TEST_NATIVE_CATALOG: ${{ github.workspace }}/rust/target/release/englishctl
          ENGLISH_TEST_RUST_SERVER: ${{ github.workspace }}/rust/target/release/english-server
        run: python -m unittest test_rust_api test_rust_management test_rust_operations test_rust_content test_rust_catalog test_memory_optimization test_http_cache
