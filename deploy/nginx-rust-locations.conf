# Include within each existing HTTPS server block; preserve its certificates/listeners.
root /opt/englishlearning/app/static;
index index.html;
client_max_body_size 2m;
client_body_timeout 15s;
send_timeout 30s;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 8443;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 15s;
}
location = /internal/ready { return 404; }
location ^~ /internal/ { return 404; }
location /assets/ {
    gzip_static on;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
