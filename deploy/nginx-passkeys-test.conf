server {
    listen 80;
    listen [::]:80;
    server_name english.16-76-139-180.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://english.16-76-139-180.sslip.io:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name english.16-76-139-180.sslip.io;

    ssl_certificate /etc/letsencrypt/live/englishlearning-passkeys-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englishlearning-passkeys-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:englishlearning_passkeys_tls:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
}
